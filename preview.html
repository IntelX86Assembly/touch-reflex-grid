<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Numpad Whack-a-Mole</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#11131a;
  color:#f4f5f7;
  font-family:Arial,Helvetica,sans-serif;
}
.app{
  width:min(720px,94vw);
  max-height:100vh;
  text-align:center;
  padding:20px;
}
h1{margin:0 0 8px;font-size:clamp(28px,5vw,42px)}
.subtitle{color:#9da3b0;margin-bottom:24px}
.stats{display:flex;justify-content:center;gap:42px;margin-bottom:22px}
.stats span{color:#9da3b0;font-size:14px}
.stats strong{display:block;color:#fff;font-size:25px;margin-top:3px}
.grid{
  width:min(500px,82vw,65vh);
  aspect-ratio:1;
  margin:0 auto 25px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}
.cell{
  border:2px solid #2d3340;
  border-radius:16px;
  background:#1b1f28;
  cursor:pointer;
  transition:background .08s,transform .08s,box-shadow .08s;
  -webkit-tap-highlight-color:transparent;
}
.cell:hover{border-color:#444b59}
.cell.active{
  background:#f4f5f8;
  border-color:#e6e9ef;
  box-shadow:0 0 12px rgba(255,255,255,.25);
  transform:scale(.97);
}
.cell.hit{background:#65e6a4;border-color:#9df2c5}
.cell.miss{background:#e86c75;border-color:#f49aa0}
button{
  border:0;border-radius:10px;padding:12px 24px;background:#e9edf5;
  color:#11131a;font:inherit;font-weight:700;cursor:pointer;
}
button:hover{filter:brightness(1.07)}
.message{min-height:24px;margin-top:13px;color:#aeb4c0}
.menu{position:fixed;top:18px;right:18px;z-index:5}
.menuBtn{width:46px;height:46px;padding:0;font-size:22px}
.panel{
  display:none;position:absolute;right:0;top:56px;width:280px;
  padding:18px;background:#1a1e27;border:1px solid #343a48;
  border-radius:14px;text-align:left;box-shadow:0 15px 45px rgba(0,0,0,.45);
}
.panel.open{display:block}
.panel h2{margin:0 0 16px;font-size:18px}
.setting{margin-bottom:17px}
.setting label{display:flex;justify-content:space-between;color:#cbd0da;font-size:14px;margin-bottom:7px}
.setting input{width:100%}
.help{color:#8f96a5;font-size:13px;line-height:1.5}

@media(max-height:650px){
  .app{padding:10px}
  h1{font-size:28px;margin-bottom:5px}
  .subtitle{margin-bottom:10px}
  .stats{margin-bottom:10px}
  .grid{margin-bottom:10px;gap:8px}
  .message{margin-top:7px}
}
</style>
</head>
<body>

<div class="menu">
  <button class="menuBtn" id="menuBtn">☰</button>
  <div class="panel" id="panel">
    <h2>Settings</h2>
    <div class="setting">
      <label>Play time <span id="timeValue">30 s</span></label>
      <input id="playTime" type="range" min="5" max="180" step="5" value="30">
    </div>
    <div class="setting">
      <label>Stimulus speed <span id="speedValue">750 ms</span></label>
      <input id="speed" type="range" min="150" max="2000" step="50" value="750">
    </div>
    <div class="help">
      Click the lit square or use the matching number-pad key.<br><br>
      <b>7 8 9</b><br>
      <b>4 5 6</b><br>
      <b>1 2 3</b>
    </div>
  </div>
</div>

<div class="app">
  <h1>Whack-a-Mole</h1>
  <div class="subtitle">Hit the square that lights up.</div>

  <div class="stats">
    <div><span>Score</span><strong id="score">0</strong></div>
    <div><span>Time</span><strong id="time">30</strong></div>
    <div><span>Best</span><strong id="best">0</strong></div>
  </div>

  <div class="grid" id="grid">
    <div class="cell" data-key="7"></div>
    <div class="cell" data-key="8"></div>
    <div class="cell" data-key="9"></div>
    <div class="cell" data-key="4"></div>
    <div class="cell" data-key="5"></div>
    <div class="cell" data-key="6"></div>
    <div class="cell" data-key="1"></div>
    <div class="cell" data-key="2"></div>
    <div class="cell" data-key="3"></div>
  </div>

  <button id="start">Start Game</button>
  <div class="message" id="message">Press Start Game to begin.</div>
</div>

<script>
const cells=[...document.querySelectorAll('.cell')];
const scoreEl=document.getElementById('score');
const timeEl=document.getElementById('time');
const bestEl=document.getElementById('best');
const message=document.getElementById('message');
const startBtn=document.getElementById('start');
const menuBtn=document.getElementById('menuBtn');
const panel=document.getElementById('panel');
const playTime=document.getElementById('playTime');
const speed=document.getElementById('speed');
const timeValue=document.getElementById('timeValue');
const speedValue=document.getElementById('speedValue');

let running=false,activeKey=null,score=0,stimulusTimer=null,clockTimer=null,startTime=0;
let best=Number(localStorage.getItem('whackMoleBest')||0);
bestEl.textContent=best;

function updateLabels(){
  timeValue.textContent=playTime.value+' s';
  speedValue.textContent=speed.value+' ms';
}
updateLabels();
playTime.addEventListener('input',updateLabels);
speed.addEventListener('input',updateLabels);

menuBtn.addEventListener('click',e=>{
  e.stopPropagation();
  panel.classList.toggle('open');
});
document.addEventListener('click',()=>panel.classList.remove('open'));

function clearCells(){
  cells.forEach(c=>c.className='cell');
  activeKey=null;
}

function lightNext(){
  if(!running)return;
  cells.forEach(c=>c.classList.remove('active','hit','miss'));

  const available=cells.filter(c=>c.dataset.key!==activeKey);
  const chosen=available[Math.floor(Math.random()*available.length)];
  activeKey=chosen.dataset.key;
  chosen.classList.add('active');

  stimulusTimer=setTimeout(lightNext,Number(speed.value));
}

function correctHit(key){
  if(!running || key!==activeKey)return false;

  const cell=cells.find(c=>c.dataset.key===key);
  score++;
  scoreEl.textContent=score;
  cell.classList.remove('active');
  cell.classList.add('hit');
  activeKey=null;

  clearTimeout(stimulusTimer);
  stimulusTimer=setTimeout(lightNext,Math.min(80,Number(speed.value)/3));
  return true;
}

function wrongHit(key){
  const cell=cells.find(c=>c.dataset.key===key);
  if(!cell)return;
  cell.classList.add('miss');
  setTimeout(()=>cell.classList.remove('miss'),160);
}

function endGame(){
  running=false;
  clearTimeout(stimulusTimer);
  clearTimeout(clockTimer);
  clearCells();

  if(score>best){
    best=score;
    localStorage.setItem('whackMoleBest',best);
    bestEl.textContent=best;
  }

  timeEl.textContent='0';
  message.textContent='Time! Final score: '+score;
  startBtn.textContent='Play Again';
}

function startGame(){
  clearTimeout(stimulusTimer);
  clearTimeout(clockTimer);
  clearCells();

  score=0;
  scoreEl.textContent='0';

  const duration=Number(playTime.value);
  timeEl.textContent=duration;
  startTime=performance.now();
  running=true;

  startBtn.textContent='Restart';
  message.textContent='Go!';

  lightNext();

  function clock(){
    if(!running)return;
    const remaining=Math.max(0,duration-(performance.now()-startTime)/1000);
    timeEl.textContent=Math.ceil(remaining);

    if(remaining<=0) endGame();
    else clockTimer=setTimeout(clock,50);
  }
  clock();
}

cells.forEach(cell=>{
  cell.addEventListener('click',()=>{
    if(!running)return;
    const key=cell.dataset.key;
    if(!correctHit(key))wrongHit(key);
  });
});

document.addEventListener('keydown',e=>{
  if(e.repeat)return;

  if(e.key==='Enter' && !running){
    startGame();
    return;
  }

  if(!running)return;

  let key=e.key;
  if(e.code.startsWith('Numpad')) key=e.code.slice(6);

  if(!/^[1-9]$/.test(key))return;

  if(!correctHit(key))wrongHit(key);
});

startBtn.addEventListener('click',startGame);
</script>
</body>
</html>
